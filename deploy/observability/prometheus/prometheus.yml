global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: chatapp-realtime
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/chatapp-realtime.json

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]