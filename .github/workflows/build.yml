name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore locked dependency graph
        run: dotnet restore ChatApp.TcpGateway.sln --locked-mode

      - name: Build
        run: dotnet build ChatApp.TcpGateway.sln --configuration Release --no-restore

      - name: Test architecture and behavior
        run: dotnet test tests/ChatApp.TcpGateway.Tests/ChatApp.TcpGateway.Tests.csproj --configuration Release --no-build --no-restore
